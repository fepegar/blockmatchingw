[project]
site_name = "Documentation"
site_description = "Documentation for blockmatchingw, a Python wrapper for Klab-BlockMatching."
site_author = "Fernando Pérez-García"
copyright = """
Copyright &copy; 2026 The authors
"""

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "CLI Reference" = "cli.md" },
  { "Python API" = "python-api.md" },
]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
